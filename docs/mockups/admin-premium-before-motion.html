function openQuickEditor(id,field,variantIndex=null){
 const p=products.find(p=>p.id===id);if(!p)return;const indices=p.variants?.length?(variantIndex===null?p.variants.map((_,i)=>i):[variantIndex]):[null];quickContext={productId:id,field,indices};

 document.getElementById('variant-list').innerHTML=indices.map(i=>{const row=i===null?p:p.variants[i];return isMultiple?`<div class="variant-line"><h3>${escape(row.name)}</h3><p class="sub">SKU ${escape(row.sku)}</p><div class="single-value"><label class="sr-only" for="quick-${i}">${label} ${escape(row.name)}</label>${field==='price'?'<span class="prefix">Rp</span>':''}<input id="quick-${i}" data-quick-value data-index="${i}" type="number" inputmode="numeric" step="1" min="${field==='price'?1:0}" value="${row[field]}" required>${field==='stock'?'<span class="prefix">unit</span>':''}</div></div>`:`<div>${i!==null?`<h3>${escape(row.name)}</h3><p class="sub">SKU ${escape(row.sku)}</p>`:''}<label for="quick-single" style="font-size:11px">${label}</label><div class="single-value">${field==='price'?'<span class="prefix">Rp</span>':''}<input id="quick-single" data-quick-value data-index="${i===null?'product':i}" type="number" inputmode="numeric" step="1" min="${field==='price'?1:0}" value="${row[field]}" required>${field==='stock'?'<span class="prefix">unit</span>':''}</div></div>`}).join('');

function saveQuickEditor(){if(!quickContext)return;const inputs=Array.from(document.querySelectorAll('[data-quick-value]'));const bad=inputs.find(e=>!validQuickNumber(e.value,quickContext.field));if(bad){document.getElementById('variant-error').textContent=quickContext.field==='price'?'Harga harus berupa bilangan bulat lebih dari nol.':'Stok harus berupa bilangan bulat nol atau lebih.';bad.setAttribute('aria-invalid','true');bad.focus();return}const p=products.find(p=>p.id===quickContext.productId);inputs.forEach(e=>{const row=e.dataset.index==='product'?p:p.variants[Number(e.dataset.index)];row[quickContext.field]=Number(e.value)});aggregateVariants(p);const field=quickContext.field,id=p.id;document.getElementById('variant-dialog').close();renderRows();document.querySelector(`[data-quick-product="${id}"][data-quick-field="${field}"]`)?.focus();toast(`${field==='price'?'Harga':'Stok'} diperbarui pada mockup. Data toko tidak berubah.`);quickContext=null}
function formVariantRows(){return variantFormDraft.map((v,i)=>`<div class="variant-line"><div class="feature-title"><h3>Varian ${i+1}</h3><button type="button" class="button quiet" data-remove-form-variant="${i}" aria-label="Hapus varian ${i+1}">Hapus</button></div><div class="fields">${[['name','Nama varian','text'],['sku','SKU varian','text'],['price','Harga (Rp)','number'],['stock','Stok','number'],['weight','Berat (gram)','number']].map(([key,label,type])=>`<div class="field"><label for="fv-${i}-${key}">${label}</label><input id="fv-${i}-${key}" data-form-variant="${i}" data-variant-key="${key}" type="${type}" ${type==='number'?`min="${key==='stock'?0:1}" step="1"`:''} ${['name','price','stock','weight'].includes(key)?'required':''} value="${escape(v[key]??'')}"></div>`).join('')}</div></div>`).join('')}
function updateFormVariants(){const enabled=document.getElementById('has-variants').checked;['price','stock','sku','weight'].forEach(id=>{const e=document.getElementById(id);e.disabled=enabled;e.classList.toggle('disabled-by-variants',enabled)});document.getElementById('form-variant-area').hidden=!enabled;document.querySelectorAll('[data-form-variant]').forEach(e=>e.disabled=!enabled);document.getElementById('form-variant-hint').textContent=enabled?'Harga, stok, SKU, dan berat dikelola per varian.':'Harga, stok, SKU, dan berat menggunakan nilai produk tunggal.'}
function enhanceProductForm(isNew){
 const p=isNew?null:products.find(p=>p.id===editingId);variantFormDraft=(p?.variants||[{name:'Ukuran standar',sku:p?.sku||'',price:p?.price||'',stock:p?.stock||0,weight:p?.weight||500}]).map(v=>({...v}));
 const media=document.querySelector('.photo-grid');media.insertAdjacentHTML('afterend',`<div class="media-extra">${button('Tambah video','type="button" data-note="Fitur video dipertahankan. Unggah dan hapus video menggunakan layanan yang sudah ada saat implementasi."')}${button('Atur urutan foto','type="button" data-note="Foto utama, urutan, dan penghapusan foto tetap tersedia dalam rancangan."')}</div>`);
 document.getElementById('brand').parentElement.insertAdjacentHTML('beforeend',`<button type="button" class="button quiet" data-note="Tambah brand baru tetap tersedia; mockup ini menampilkan posisi tindakannya.">+ Tambah brand</button>`);
 const description=document.getElementById('description');description.value=p?.description||'';description.previousElementSibling.insertAdjacentHTML('afterend',`<div class="feature-title"><span class="sub">Deskripsi dapat ditulis manual atau dibantu AI.</span><button type="button" class="button" data-description-demo>Bantu dengan AI</button></div>`);
 const sales=document.getElementById('price').closest('.form-panel');sales.querySelector('h2').textContent='Informasi penjualan';sales.querySelector('.fields').insertAdjacentHTML('beforebegin',`<div class="variant-config"><label class="variant-switch" for="has-variants"><input id="has-variants" type="checkbox" ${p?.variants?.length?'checked':''}>Produk memiliki varian</label><p class="sub" id="form-variant-hint"></p><div id="form-variant-area" class="form-variant-editor"><div id="form-variant-rows">${formVariantRows()}</div><div class="variant-summary">${button('+ Tambah varian','type="button" data-add-form-variant')}</div></div></div>`);
 document.getElementById('stock').previousElementSibling.textContent='Stok';document.getElementById('weight').name='weight';document.getElementById('weight').value=p?.weight||2000;document.getElementById('weight').required=true;
 document.querySelector('.form-stack').insertAdjacentHTML('beforeend',`<details class="panel form-panel optional-panel"><summary><div>Perawatan (obat)<small>Kategori obat, spesies target, dan aturan dosis tetap tersedia.</small></div></summary><div class="fields"><div class="field full"><label for="care-category">Kategori obat</label><select id="care-category" name="careCategory"><option value="">Bukan obat cacing/kutu</option><option value="deworm">Obat cacing</option><option value="flea">Obat kutu</option></select><small>Bagian opsional untuk produk perawatan.</small></div></div><div id="care-details" hidden><div class="care-species">${['Kucing','Anjing','Kelinci'].map(s=>`<label><input type="checkbox" name="species" value="${s}">${s}</label>`).join('')}</div><div class="dosage-placeholder">Aturan dosis berdasarkan berat hewan dan instruksi produk.</div><div class="actions" style="margin-top:12px">${button('Ekstrak dosis dari deskripsi','type="button" data-note="Fitur ekstraksi tetap dipertahankan. Mockup tidak menghasilkan saran atau dosis medis."')}${button('+ Tambah aturan','type="button" data-note="Aturan min/max berat dan instruksi dosis tetap tersedia saat implementasi."')}</div></div></details>`);
 if(p){const statusBadge=document.querySelector('.page-title .badge');statusBadge.className='badge '+(p.status==='Draf'?'gray':'green');statusBadge.innerHTML='<span class="dot"></span>'+escape(p.status);document.getElementById('care-category').value=p.careCategory||'';document.getElementById('care-details').hidden=!p.careCategory;document.querySelectorAll('input[name="species"]').forEach(e=>e.checked=(p.species||[]).includes(e.value))}
 updateFormVariants();
}
function route(){const part=location.hash.slice(1)||'dashboard';if(part.startsWith('edit-')){editingId=Number(part.slice(5));if(!products.some(p=>p.id===editingId))editingId=1;current='form'}else if(part.startsWith('order-'))current='detail';else current=['dashboard','products','orders','promos','content','customers','reports','settings','form-new'].includes(part)?part:'dashboard';const views={dashboard,products:productsPage,orders:ordersPage,promos:promosPage,content:contentPage,customers:customersPage,reports:reportsPage,settings:settingsPage};document.getElementById('main').innerHTML=current==='form'||current==='form-new'?formPage(current==='form-new'):current==='detail'?orderDetail(part.slice(6)):views[current]();renderNav();if(current==='products'){document.getElementById('category-filter').value=category;document.querySelector('.page-title>.actions').insertAdjacentHTML('afterbegin',button('Impor','data-note="Impor katalog tetap tersedia. Alur impor menggunakan fitur yang sudah ada saat implementasi."'));renderRows()}if(current==='form'||current==='form-new')enhanceProductForm(current==='form-new');closeMenu();window.scrollTo(0,0);document.title='Natalo — '+document.getElementById('crumb').textContent+' · Mockup'}
function go(id){if(location.hash==='#'+id)route();else location.hash=id}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),4200)}
function openMenu(){const side=document.getElementById('sidebar');side.inert=false;side.removeAttribute('aria-hidden');side.setAttribute('role','dialog');side.setAttribute('aria-modal','true');side.classList.add('open');document.getElementById('veil').classList.add('open');document.querySelector('.workspace').inert=true;document.getElementById('mobile-nav').inert=true;document.getElementById('menu-toggle').setAttribute('aria-expanded','true');document.querySelector('.close-menu').focus()}
function closeMenu(){const side=document.getElementById('sidebar'),wasOpen=side.classList.contains('open');side.classList.remove('open');side.removeAttribute('role');side.removeAttribute('aria-modal');document.getElementById('veil').classList.remove('open');document.querySelector('.workspace').inert=false;document.getElementById('mobile-nav').inert=false;document.getElementById('menu-toggle').setAttribute('aria-expanded','false');syncMenu();if(wasOpen&&window.matchMedia('(max-width:760px)').matches)document.getElementById('menu-toggle').focus()}
function syncMenu(){const side=document.getElementById('sidebar'),hidden=window.matchMedia('(max-width:760px)').matches&&!side.classList.contains('open');side.inert=hidden;if(hidden)side.setAttribute('aria-hidden','true');else side.removeAttribute('aria-hidden')}
document.addEventListener('click',e=>{const goButton=e.target.closest('[data-go]');if(goButton)go(goButton.dataset.go);const edit=e.target.closest('[data-edit]');if(edit)go('edit-'+edit.dataset.edit);const order=e.target.closest('[data-order]');if(order){e.preventDefault();go('order-'+order.dataset.order)}const note=e.target.closest('[data-note]');if(note)toast(note.dataset.note);const f=e.target.closest('[data-product-filter]');if(f){productFilter=f.dataset.productFilter;document.querySelectorAll('[data-product-filter]').forEach(b=>{b.classList.toggle('active',b===f);b.setAttribute('aria-selected',String(b===f))});renderRows()}if(e.target.closest('[data-open-menu]')||e.target.closest('#menu-toggle'))openMenu();if(e.target.closest('[data-close-menu]')||e.target.id==='veil')closeMenu()});
document.addEventListener('click',e=>{const link=e.target.closest('.nav-link');if(link){e.preventDefault();go(link.getAttribute('href').slice(1));closeMenu()}});
document.addEventListener('input',e=>{if(e.target.id==='product-search'){query=e.target.value;renderRows()}if(e.target.id==='order-search')filterOrders();if(e.target.id==='customer-search')document.getElementById('customer-rows').innerHTML=customerRows(e.target.value);if(e.target.closest('#product-form')){document.getElementById('save-hint').textContent='Belum disimpan · Data contoh';if(e.target.id==='name')document.getElementById('preview-name').textContent=e.target.value||'Nama produk Anda';if(e.target.id==='price')document.getElementById('preview-price').textContent=rupiah(e.target.value||0)}});
document.addEventListener('change',e=>{if(e.target.id==='category-filter'){category=e.target.value;renderRows()}if(e.target.id==='order-filter')filterOrders();if(e.target.id==='brand'&&document.getElementById('preview-brand'))document.getElementById('preview-brand').textContent=e.target.value;if(e.target.matches('[data-select]')){const id=Number(e.target.dataset.select);e.target.checked?selected.add(id):selected.delete(id);updateSelected()}if(e.target.id==='select-all'){document.querySelectorAll('[data-select]').forEach(cb=>{cb.checked=e.target.checked;const id=Number(cb.dataset.select);e.target.checked?selected.add(id):selected.delete(id)});updateSelected()}if(e.target.id==='revenue-period'){document.getElementById('revenue-total').textContent=e.target.value==='Hari ini'?'Rp 3.842.500':'Rp 24.680.000';toast('Periode pendapatan contoh diubah.')}});
function filterOrders(){const q=document.getElementById('order-search').value.toLowerCase(),f=document.getElementById('order-filter').value;document.getElementById('order-rows').innerHTML=orderRows(orders.filter(o=>(o.name+' '+o.number).toLowerCase().includes(q)&&(f==='Semua status'||o.status===f)))}
document.addEventListener('click',e=>{
 const quick=e.target.closest('[data-quick-product]');if(quick)openQuickEditor(Number(quick.dataset.quickProduct),quick.dataset.quickField,quick.hasAttribute('data-quick-variant')?Number(quick.dataset.quickVariant):null);
 const expand=e.target.closest('[data-expand]');if(expand){const id=Number(expand.dataset.expand);expandedProducts.has(id)?expandedProducts.delete(id):expandedProducts.add(id);renderRows();document.querySelector(`[data-expand="${id}"]`)?.focus()}
 if(e.target.closest('[data-close-variants]')){document.getElementById('variant-dialog').close();quickContext=null}
 if(e.target.closest('[data-save-variants]'))saveQuickEditor();if(e.target.closest('[data-apply-variants]'))applyQuickBulk();
 if(e.target.closest('[data-add-form-variant]')){variantFormDraft.push({name:'',sku:'',price:'',stock:0,weight:500});document.getElementById('form-variant-rows').innerHTML=formVariantRows();updateFormVariants();document.getElementById(`fv-${variantFormDraft.length-1}-name`).focus()}
 const remove=e.target.closest('[data-remove-form-variant]');if(remove){variantFormDraft.splice(Number(remove.dataset.removeFormVariant),1);document.getElementById('form-variant-rows').innerHTML=formVariantRows();updateFormVariants()}
 if(e.target.closest('[data-description-demo]')){const name=document.getElementById('name').value.trim();if(!name){document.getElementById('name').focus();toast('Isi nama produk terlebih dahulu.');return}document.getElementById('description').value=`${name}.\n\nLengkapi informasi ukuran, komposisi, manfaat, dan petunjuk penggunaan sesuai label produk.`;document.getElementById('save-hint').textContent='Belum disimpan · Data contoh';toast('Contoh bantuan deskripsi. Layanan AI tidak dipanggil oleh mockup.')}
});
document.addEventListener('input',e=>{if(e.target.matches('[data-form-variant]')){const key=e.target.dataset.variantKey;variantFormDraft[Number(e.target.dataset.formVariant)][key]=['price','stock','weight'].includes(key)?(e.target.value===''?'':Number(e.target.value)):e.target.value}});
document.addEventListener('change',e=>{if(e.target.id==='has-variants')updateFormVariants();if(e.target.id==='care-category')document.getElementById('care-details').hidden=!e.target.value});
document.addEventListener('submit',e=>{if(e.target.id!=='product-form')return;e.preventDefault();const f=e.target,values=new FormData(f),hasVariants=document.getElementById('has-variants').checked;if(hasVariants&&!variantFormDraft.length){toast('Tambahkan minimal satu varian.');document.querySelector('[data-add-form-variant]').focus();return}let p=current==='form-new'?{id:Date.now(),color:'#a93036'}:products.find(p=>p.id===editingId);Object.assign(p,{name:String(values.get('name')),sku:hasVariants?(p.sku||''):String(values.get('sku')),category:String(values.get('category')),brand:String(values.get('brand')),price:hasVariants?0:Number(values.get('price')),stock:hasVariants?0:Number(values.get('stock')),weight:hasVariants?0:Number(values.get('weight')),description:String(values.get('description')),careCategory:String(values.get('careCategory')),species:values.getAll('species'),status:String(values.get('status')),variants:hasVariants?variantFormDraft.map(v=>({...v})):[]});aggregateVariants(p);if(current==='form-new')products.unshift(p);query='';productFilter='Semua';category='Semua kategori';go('products');toast('Perubahan tersimpan pada mockup ini. Data toko tidak berubah.');});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-quick-value]')){e.preventDefault();saveQuickEditor()}if(e.key==='Escape'&&document.getElementById('sidebar').classList.contains('open')){closeMenu();document.getElementById('menu-toggle').focus()}if(e.key==='Tab'&&document.getElementById('sidebar').classList.contains('open')){const links=Array.from(document.getElementById('sidebar').querySelectorAll('button,a'));const first=links[0],last=links[links.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',route);window.addEventListener('resize',()=>{if(!window.matchMedia('(max-width:760px)').matches)closeMenu();else syncMenu()});route();
</script>
</body>
