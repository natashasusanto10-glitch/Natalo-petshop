<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup foto varian Natalo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#162b49;font:14px system-ui,sans-serif}main{max-width:1000px;margin:48px auto;padding:0 24px}h1{font-size:26px;letter-spacing:-.6px;margin-bottom:8px}.muted{color:#778399;font-size:13px}section{margin-top:26px;background:white;border:1px solid #e1e7ef;border-radius:18px;padding:26px}h2{font-size:17px;margin:0 0 24px}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;font-weight:500;color:#718096;padding:14px;background:#f8fafc}td{border-top:1px solid #edf0f5;padding:20px 14px;vertical-align:middle}.variant{display:flex;align-items:center;gap:20px}.photo{position:relative;width:76px;height:76px;flex-shrink:0;border:1px solid #e2e8f0;border-radius:10px;background:white}.photo>button{border:0;background:none;padding:5px;width:100%;height:100%;cursor:pointer}.photo img{height:100%;width:100%;object-fit:contain}.tools{position:absolute;bottom:-14px;left:5px;right:5px;display:flex;background:white;box-shadow:0 3px 10px #162b4920;border:1px solid #e3e8f0;border-radius:8px;opacity:0;transform:translateY(3px);transition:opacity .16s,transform .16s}.photo:hover .tools,.photo:focus-within .tools{opacity:1;transform:none}.tools button{height:30px;flex:1;border:0;background:none;cursor:pointer;color:#235dcc}.tools button:last-child{color:#a94444}input{width:120px;padding:11px;border:1px solid #d8e1ee;border-radius:8px;color:#162b49;font:inherit}.sku{width:180px}.empty{border-style:dashed;color:#6b89b1}.action{padding:11px 20px;border:1px solid #d8e1ee;border-radius:9px;background:white;color:#162b49;font:inherit;cursor:pointer}.primary{background:#215bc4;color:white;border-color:#215bc4}footer{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}dialog{padding:0;border:0;border-radius:18px;width:690px;max-width:95vw;box-shadow:0 24px 90px #14264240}dialog::backdrop{background:#15263f70;backdrop-filter:blur(3px)}.head{padding:22px 26px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e7ecf2}.head h2{margin:0}.head button{border:0;background:none;font-size:22px;color:#718096;cursor:pointer}.editor{padding:26px;display:grid;grid-template-columns:1fr 120px;gap:26px}.crop{aspect-ratio:1;position:relative;overflow:hidden;background:#f8fafc;border:2px solid #3b82f6;border-radius:6px;display:grid;place-items:center}.crop:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33%,#ffffffa0 33%,#ffffffa0 33.4%,transparent 33.4%,transparent 66%,#ffffffa0 66%,#ffffffa0 66.4%,transparent 66.4%),linear-gradient(transparent 33%,#ffffffa0 33%,#ffffffa0 33.4%,transparent 33.4%,transparent 66%,#ffffffa0 66%,#ffffffa0 66.4%,transparent 66.4%)}.crop img{width:90%;height:90%;object-fit:contain;transition:transform .18s}.preview img{width:100%;aspect-ratio:1;object-fit:contain;border:1px solid #e2e8f0;border-radius:8px;margin-top:12px}.controls{display:flex;align-items:center;gap:10px;margin-top:18px}.controls input{width:100%;padding:0}.dialog-foot{padding:20px 26px;border-top:1px solid #e7ecf2;display:flex;justify-content:flex-end;gap:10px}.status{color:#237c57;font-size:13px;min-height:20px}.scroll{overflow:auto}@media(hover:none){.tools{opacity:1;transform:none}}@media(max-width:650px){main{margin:24px auto;padding:0 14px}section{padding:16px}table{min-width:680px}.editor{grid-template-columns:1fr}.preview{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<main><p class="muted">NATALO ADMIN · MOCKUP</p><h1>Foto varian yang lebih rapi</h1><p class="muted">Contoh desain dengan data produk ilustrasi.</p><section><h2>Daftar variasi</h2><div class="scroll"><table><thead><tr><th>Varian & foto</th><th>Harga</th><th>Stok</th><th>SKU</th></tr></thead><tbody id="rows"></tbody></table></div><footer><button class="action" onclick="openEditor(0)">Lihat dialog edit foto</button></footer><p class="status" id="status" role="status"></p></section></main>
<dialog id="dialog"><div class="head"><h2>Ubah foto varian</h2><button aria-label="Tutup" onclick="dialog.close()">×</button></div><div class="editor"><div><div class="crop"><img id="cropImage" alt="Foto varian yang diedit"></div><div class="controls"><span class="muted">Zoom</span><input id="zoom" type="range" min="100" max="180" value="100" aria-label="Zoom foto" oninput="cropImage.style.transform='scale('+this.value/100+')'"><button class="action" onclick="zoom.value=100;cropImage.style.transform='scale(1)'">Reset</button></div></div><div class="preview"><span class="muted">Pratinjau</span><img id="smallPreview" alt="Contoh pratinjau foto"></div></div><div class="dialog-foot"><button class="action" onclick="dialog.close()">Batal</button><button class="action primary" onclick="dialog.close();statusText.textContent='Contoh perubahan foto tersimpan di mockup.'">Simpan foto</button></div></dialog>
<script>
const photos=['../../public/products/angels-creamy-tuna.png','../../public/products/angels-creamy-salmon.jpg','../../public/products/angels-creamy-chicken.png'];const names=['Tuna','Salmon','Chicken','Varian baru'];const statusText=document.getElementById('status');document.getElementById('rows').innerHTML=names.map((n,i)=>`<tr><td><div class="variant"><div class="photo ${i===3?'empty':''}"><button aria-label="${i===3?'Tambah':'Pratinjau'} foto ${n}" onclick="openEditor(${i===3?0:i})">${i===3?'+':`<img src="${photos[i]}" alt="${n}">`}</button>${i===3?'':`<div class="tools"><button aria-label="Edit foto ${n}" onclick="openEditor(${i})">✎</button><button aria-label="Hapus foto ${n}" onclick="statusText.textContent='Contoh hapus foto '+names[${i}]+': konfirmasi sebelum menghapus.'">×</button></div>`}</div><div><strong>${n}</strong><p class="muted">${i===3?'Belum ada foto':'Foto varian'}</p></div></div></td><td><input value="27.000" inputmode="numeric" aria-label="Harga ${n}"></td><td><input value="12" inputmode="numeric" aria-label="Stok ${n}"></td><td><input class="sku" value="ANG-${n.toUpperCase().replace(' ','-')}" aria-label="SKU ${n}"></td></tr>`).join('');function openEditor(i){cropImage.src=photos[i];smallPreview.src=photos[i];zoom.value=100;cropImage.style.transform='scale(1)';dialog.showModal()}
</script></html>
