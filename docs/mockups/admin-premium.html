'use strict';
function parsePriceInput(value){
 const raw=String(value??'').trim();
 if(!/^(?:[0-9]+|[0-9]{1,3}(?:\.[0-9]{3})+)$/.test(raw))return NaN;
 return Number(raw.replace(/\./g,''));
}
function formatPriceInput(value){
 const raw=String(value??'');if(raw==='')return '';
 if(!/^[0-9.\s]+$/.test(raw))return raw;
 const digits=raw.replace(/[.\s]/g,'').replace(/^0+(?=[0-9])/,'');
 return digits.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}
function validatePriceInput(input){
 const min=Number(input.dataset.priceMin||1),n=parsePriceInput(input.value);
 input.setCustomValidity(input.value===''?'':!Number.isSafeInteger(n)?'Isi harga berupa bilangan bulat yang valid.':n<min?'Harga harus lebih dari nol.':'');
}
function initializePriceInputs(root=document){
 root.querySelectorAll('#price,#variation-bulk-price,[data-variant-key="price"],[data-price-input]').forEach(input=>{
  if(input.tagName!=='INPUT')return;
  input.dataset.priceInput='';input.dataset.priceMin=input.getAttribute('min')||input.dataset.priceMin||'1';
  input.type='text';input.inputMode='numeric';input.autocomplete='off';input.spellcheck=false;
  input.value=formatPriceInput(input.value);validatePriceInput(input);
 });
}
// Capture formatting before form/variant listeners consume the input value.
document.addEventListener('input',event=>{
 const input=event.target;if(!input.matches('input[data-price-input]')||event.isComposing)return;
 const before=input.value,caret=input.selectionStart??before.length;
 const count=(before.slice(0,caret).match(/[0-9]/g)||[]).length;
 input.value=formatPriceInput(before);validatePriceInput(input);
 if(input.value!==before){let position=0,seen=0;while(position<input.value.length&&seen<count){if(/[0-9]/.test(input.value[position]))seen++;position++}input.setSelectionRange(position,position)}
},true);
document.addEventListener('beforeinput',event=>{
 const input=event.target;if(!input.matches('input[data-price-input]')||input.selectionStart!==input.selectionEnd)return;
 const pos=input.selectionStart;

 if(event.inputType==='deleteContentForward'&&input.value[pos]==='.')input.setSelectionRange(pos+1,pos+1);
});

function stockBadge(row,p=row){return badge(p.status==='Arsip'?'Arsip':row.stock===0?'Habis':row.stock<5?'Menipis':'Aktif',p.status==='Arsip'?'gray':row.stock<5?'amber':'green')}

const productHandoffPrefix='natalo-admin-mockup:edit-tab:';
let productHandoffConsumed=false;
function prepareProductTab(link){
 const p=products.find(product=>product.id===Number(link.dataset.productTab));if(!p)return;
 const url=new URL(location.href);url.searchParams.delete('handoff');url.hash='edit-'+p.id;
 try{
  const oldToken=link.dataset.handoffToken;
  if(oldToken&&localStorage.getItem(productHandoffPrefix+oldToken)){url.searchParams.set('handoff',oldToken);link.href=url.href;return}
  const now=Date.now();
  // Only remove expired transfers belonging to this local mockup.
  for(let i=localStorage.length-1;i>=0;i--){const key=localStorage.key(i);if(!key?.startsWith(productHandoffPrefix))continue;try{const entry=JSON.parse(localStorage.getItem(key));if(!entry||now-entry.createdAt>300000)localStorage.removeItem(key)}catch{localStorage.removeItem(key)}}
  const token=crypto.randomUUID();localStorage.setItem(productHandoffPrefix+token,JSON.stringify({createdAt:now,product:p}));link.dataset.handoffToken=token;url.searchParams.set('handoff',token);
 }catch{
  // Keep mockup data in the URL fragment if browser storage is unavailable.
  url.hash='edit-'+p.id+'~draft='+encodeURIComponent(JSON.stringify(p));
 }
 link.href=url.href;
}
function consumeProductTab(){
 if(productHandoffConsumed)return;productHandoffConsumed=true;
 const url=new URL(location.href),token=url.searchParams.get('handoff');let snapshot=null;
 try{
  if(token){const key=productHandoffPrefix+token;const raw=localStorage.getItem(key);if(raw){localStorage.removeItem(key);const transfer=JSON.parse(raw);if(transfer&&Date.now()-transfer.createdAt<=300000)snapshot=transfer.product}}
  else if(url.hash.includes('~draft='))snapshot=JSON.parse(decodeURIComponent(url.hash.split('~draft=')[1]));
  const requestedId=Number(url.hash.slice(6).split('~')[0]);
  if(snapshot&&snapshot.id===requestedId&&Number.isFinite(snapshot.id)&&['name','sku','brand','category','status'].every(key=>typeof snapshot[key]==='string')&&Number.isFinite(snapshot.price)&&Number.isFinite(snapshot.stock)){
   snapshot.color=/^#[0-9a-f]{3,8}$/i.test(snapshot.color||'')?snapshot.color:'#245bd6';
   const index=products.findIndex(p=>p.id===snapshot.id);if(index<0)products.unshift(snapshot);else products[index]=snapshot;
  }
 }catch{toast('Data contoh untuk tab baru tidak tersedia. Produk bawaan ditampilkan.')}
 if(token||url.hash.includes('~draft=')){url.searchParams.delete('handoff');url.hash=url.hash.split('~draft=')[0];history.replaceState(null,'',url.href)}
}

 if(e.target.closest('[data-description-demo]')){const name=document.getElementById('name').value.trim();if(!name){document.getElementById('name').focus();toast('Isi nama produk terlebih dahulu.');return}document.getElementById('description').value=`${name}.\n\nLengkapi informasi ukuran, komposisi, manfaat, dan petunjuk penggunaan sesuai label produk.`;document.getElementById('save-hint').textContent='Belum disimpan';toast('Contoh bantuan deskripsi. Layanan AI tidak dipanggil oleh mockup.')}
});
function setupSellerFormSections(){
 const stack=document.querySelector('.form-stack');const first=stack.querySelector('.form-panel');
 const descriptionField=document.getElementById('description').closest('.field');
 const desc=document.createElement('section');desc.className='panel form-panel';desc.innerHTML='<h2>Deskripsi</h2><div class="fields"></div>';desc.querySelector('.fields').append(descriptionField);first.after(desc);
 const sections=Array.from(stack.querySelectorAll('section.form-panel'));sections.forEach((el,i)=>el.id='product-section-'+i);
 document.getElementById('product-form').insertAdjacentHTML('afterbegin',`<nav class="seller-jumps" aria-label="Bagian formulir produk">${sections.map((el,i)=>`<a href="#product-section-${i}" data-form-section="${i}">${escape(el.querySelector('h2').textContent)}</a>`).join('')}</nav>`);
}
document.addEventListener('click',e=>{const jump=e.target.closest('[data-form-section]');if(jump){e.preventDefault();document.getElementById('product-section-'+jump.dataset.formSection).scrollIntoView({behavior:motionAllowed()?'smooth':'instant',block:'start'})}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-group-option],[data-group-name],.variant-bulk-form input')){e.preventDefault();if(e.target.matches('[data-group-option]'))document.querySelector(`[data-add-choice="${e.target.dataset.groupOption}"]`).click();else if(e.target.matches('.variant-bulk-form input'))applyFormVariationBulk()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-group-name]'))variantGroupsDraft[Number(e.target.dataset.groupName)].name=e.target.value;if(e.target.matches('[data-group-option]'))variantGroupsDraft[Number(e.target.dataset.groupOption)].options[Number(e.target.dataset.optionIndex)].value=e.target.value;if(e.target.matches('[data-group-name],[data-group-option]'))rebuildVariationRows();});
document.addEventListener('input',e=>{if(e.target.matches('[data-form-variant]')){const key=e.target.dataset.variantKey;variantFormDraft[Number(e.target.dataset.formVariant)][key]=['price','stock','weight'].includes(key)?(e.target.value===''?'':key==='price'?parsePriceInput(e.target.value):Number(e.target.value)):e.target.value;updateVariationSummary()}});
document.addEventListener('change',e=>{if(e.target.id==='has-variants'){updateFormVariants();if(e.target.checked)revealContent(document.getElementById('form-variant-area'),3,180)}if(e.target.id==='care-category')document.getElementById('care-details').hidden=!e.target.value});
document.addEventListener('submit',e=>{if(e.target.id!=='product-form')return;e.preventDefault();const f=e.target;if(f.dataset.saving==='true')return;const values=new FormData(f),hasVariants=document.getElementById('has-variants').checked;if(hasVariants&&!validateVariationGroups()){f.reportValidity();return}if(hasVariants&&!variantFormDraft.length){toast('Tambahkan minimal satu varian.');document.getElementById('variation-name-0').focus();return}const isNew=current==='form-new',productId=editingId,submitButton=f.querySelector('[type=submit]');f.dataset.saving='true';f.setAttribute('aria-busy','true');f.querySelectorAll('input,select,textarea,button:not([data-go])').forEach(el=>el.disabled=true);submitButton.setAttribute('aria-busy','true');submitButton.innerHTML='<span class="saving-spinner" aria-hidden="true"></span>Menyimpan…';document.getElementById('save-hint').textContent='Menyimpan perubahan contoh…';setTimeout(()=>{if(!f.isConnected)return;let p=isNew?{id:Date.now(),color:'#a93036'}:products.find(p=>p.id===productId);Object.assign(p,{name:String(values.get('name')),sku:hasVariants?(p.sku||''):String(values.get('sku')),category:String(values.get('category')),brand:String(values.get('brand')),price:hasVariants?0:parsePriceInput(values.get('price')),stock:hasVariants?0:Number(values.get('stock')),weight:hasVariants?0:Number(values.get('weight')),description:String(values.get('description')),careCategory:String(values.get('careCategory')),species:values.getAll('species'),status:String(values.get('status')),photos:photoFormDraft.map(photo=>({...photo})),videoMock:videoFormDraft,variants:hasVariants?variantFormDraft.map(v=>({...v})):[],variantGroups:hasVariants?structuredClone(variantGroupsDraft):[]});aggregateVariants(p);if(isNew)products.unshift(p);query='';productFilter='Semua';category='Semua kategori';go('products');toast('Perubahan tersimpan pada mockup ini. Data toko tidak berubah.');},450);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-quick-value]')){e.preventDefault();saveQuickEditor()}if(e.key==='Escape'&&document.getElementById('sidebar').classList.contains('open')){closeMenu();document.getElementById('menu-toggle').focus()}if(e.key==='Tab'&&document.getElementById('sidebar').classList.contains('open')){const links=Array.from(document.getElementById('sidebar').querySelectorAll('button,a'));const first=links[0],last=links[links.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.getElementById('variant-dialog').addEventListener('cancel',e=>{e.preventDefault();closeQuickEditor()});
window.addEventListener('hashchange',route);window.addEventListener('resize',()=>{if(!window.matchMedia('(max-width:760px)').matches)closeMenu();else syncMenu()});route();
</script>
