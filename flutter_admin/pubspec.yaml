name: natalo_admin
description: "Natalo Petshop — Admin/Seller app. Shopee Seller-style untuk manage produk, orders, dan operasional toko di HP."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.0
  intl: ^0.20.2
  shimmer: ^3.0.0
  flutter_native_splash: ^2.4.4
  image_picker: ^1.1.2
  http_parser: ^4.1.2
  # Push notifications (Firebase Cloud Messaging) — disabled sampai
  # google-services.json di-drop ke android/app/. Lihat PUSH_SETUP.md.
  # firebase_core: ^3.6.0
  # firebase_messaging: ^15.1.3
  # flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/native/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/native/icon-only.png
  # Admin app pakai coral background untuk visually differentiate dari
  # customer app yang blue (#1E5FBF). Admin = orange-toned.
  adaptive_icon_background: "#EE4D2D"
  adaptive_icon_foreground: assets/native/icon-foreground.png
  min_sdk_android: 23
  remove_alpha_ios: true

flutter_native_splash:
  # Splash putih dengan logo di tengah — clean & branded.
  color: "#FFFFFF"
  image: assets/native/splash.png
  color_dark: "#101114"
  image_dark: assets/native/splash-dark.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#EE4D2D"
    image: assets/native/icon-foreground.png
    color_dark: "#101114"
    image_dark: assets/native/icon-foreground.png
