<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tidak Ada Koneksi — Natalo Petshop</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f8f8f8;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #fff1f1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ef4444;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: #111;
    }
    p {
      margin: 8px 0 0;
      font-size: 14px;
      line-height: 1.6;
      color: #6b7280;
    }
    button {
      margin-top: 24px;
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 16px;
      background: #1E5FBF;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.85; transform: scale(0.99); }
    .ghost {
      margin-top: 12px;
      background: transparent;
      color: #1E5FBF;
      border: 1px solid #d1d5db;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </div>
    <h1>Tidak Ada Koneksi</h1>
    <p>Sepertinya internet kamu sedang bermasalah. Coba periksa koneksi WiFi atau data, lalu coba lagi.</p>
    <button type="button" onclick="window.location.href='https://www.natalopetshop.com';">
      Coba Lagi
    </button>
    <button type="button" class="ghost" onclick="window.AndroidBridge && window.AndroidBridge.exit();">
      Tutup App
    </button>
  </div>
  <script>
    // Auto-retry saat koneksi pulih
    window.addEventListener('online', function() {
      window.location.href = 'https://www.natalopetshop.com';
    });
  </script>
</body>
</html>
