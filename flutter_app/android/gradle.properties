org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Optimized resource shrinking — menindaklanjuti rekomendasi Play Console
# "Improve your app's memory and performance with R8 optimization" yang
# menyebut "Optimized resource shrinking isn't enabled".
#
# Default di AGP 8.11 masih mati; jadi default di AGP 9. Nama flag diambil
# dari BooleanOption di gradle-8.11.1.jar, bukan dari ingatan.
#
# integratedResourceShrinking: R8 yang melakukan shrinking resource dalam
#   satu langkah dengan code shrinking (bukan tahap terpisah) — prasyarat
#   untuk optimizedShrinking.
# optimizedShrinking: R8 boleh membuang entri resource yang tak terjangkau
#   secara lebih agresif, termasuk merapikan resource table.
#
# RISIKO: resource yang HANYA dirujuk lewat nama string saat runtime
# (Resources.getIdentifier, nama drawable dari server) tidak terlihat oleh
# R8 dan bisa ikut terbuang → gambar/ikon hilang HANYA di build release.
# Wajib smoke test di device fisik: splash, ikon launcher, notifikasi,
# ilustrasi empty-state, dan Lottie.
android.r8.integratedResourceShrinking=true
android.r8.optimizedShrinking=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
