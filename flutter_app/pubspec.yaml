name: natalo_petshop_flutter
description: Native Flutter app for Natalo Petshop.
publish_to: none
version: 1.0.149+189
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.7.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  http: ^1.2.2
  http_parser: ^4.1.2
  image_picker: ^1.1.2
  # Inline gallery picker — query device photo library sebagai list asset
  # supaya bisa render Instagram-style grid (preview di atas, gallery
  # thumbnail tap-to-select). image_picker hanya support native OS dialog
  # yang keluar dari app — tidak match spec Buat Postingan baru.
  photo_manager: ^3.6.4
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  lottie: ^3.3.3
  flutter_native_splash: ^2.4.4
  # Native polish — match fitur Capacitor APK (haptics, share sheet, in-app review).
  share_plus: ^10.1.4
  haptic_feedback: ^0.5.1+1
  in_app_review: ^2.0.10
  # Deep link handler — terima link share (mis. wa.me share product) dari
  # native intent → buka langsung ke screen yg sesuai.
  app_links: ^6.3.2
  # Image caching: repeat-visit produk tidak refetch dari network → instant
  # load. Beda dengan WebView yang re-render <img>. Salah satu reason kenapa
  # Flutter native bisa terasa lebih cepat dari Capacitor.
  cached_network_image: ^3.4.1
  # Skeleton shimmer loader — ganti CircularProgressIndicator untuk product
  # list / grid. Native effect yang Capacitor sulit replikasi smoothly.
  shimmer: ^3.0.0
  # Video player untuk Feed TikTok-style — native ExoPlayer (Android) /
  # AVPlayer (iOS). Beda dari HTML <video> di Capacitor: better autoplay,
  # codec hardware acceleration, lebih hemat baterai.
  video_player: ^2.10.0
  # Detect kapan widget visible di viewport — dipakai untuk autoplay/pause
  # video saat user scroll antar feed item.
  visibility_detector: ^0.4.0+2
  # Quick actions — long-press app icon di launcher → shortcut langsung ke
  # screen tertentu (Cart, Wishlist, Pesanan, Tukar Poin). Native Android
  # App Shortcuts API + iOS Home Screen Quick Actions. PWA tidak bisa
  # punya ini karena tidak ada icon di launcher native.
  quick_actions: ^1.0.7
  # In-app browser untuk Blog / Help / Kebijakan / Tentang Natalo — buka
  # halaman web Natalo di dalam app dengan native chrome (back/forward/
  # refresh/share). Beda dengan url_launcher external: tidak keluar app,
  # session cookies tetap, feels lebih native dari Capacitor (yang juga
  # WebView tapi tidak ada controls).
  flutter_inappwebview: ^6.1.5
  # Firebase Cloud Messaging untuk push notification — engagement via
  # notifikasi order update, promo, voucher. Butuh google-services.json
  # dari Firebase Console (lihat FIREBASE_SETUP.md).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Firebase Crashlytics — auto-report production crashes ke Firebase Console.
  # Stack trace + breadcrumbs + custom keys untuk debug live issues. Gracefully
  # no-op kalau Firebase belum di-setup (FIREBASE_SETUP.md).
  firebase_crashlytics: ^4.1.3
  # Firebase Analytics — funnel events (view_product, add_to_cart, purchase)
  # untuk data-driven decisions. Auto-respect user consent + GDPR.
  firebase_analytics: ^11.3.3
  # Local notification untuk display foreground push (saat app terbuka).
  # FCM Android tidak auto-show notif kalau app foreground.
  flutter_local_notifications: ^18.0.1
  # Voice search — speech-to-text native (Android SpeechRecognizer + iOS
  # SFSpeechRecognizer). User tap mic di search bar → bicara → transcript
  # otomatis isi field + trigger search. Capacitor WebView pakai
  # webkitSpeechRecognition yang patchy di Android — native jauh lebih
  # akurat + responsive + support partial results untuk live transcript.
  speech_to_text: ^7.0.0
  # App info — version + build number untuk About / Settings screen.
  # Auto baca dari pubspec version + native build config.
  package_info_plus: ^8.0.2
  # Biometric authentication — Android BiometricPrompt + iOS Face ID/
  # Touch ID. Setelah first login sukses, user bisa enable "Login dengan
  # sidik jari" → next login cukup tap & touch sensor. PWA WebView TIDAK
  # bisa akses biometric hardware sama sekali (Web Authentication API
  # patchy & butuh server challenge).
  local_auth: ^2.3.0
  # Connectivity status — detect kapan device offline / network type.
  # Tampilkan offline banner kalau koneksi hilang, hide otomatis saat
  # reconnect. PWA pakai navigator.onLine yang patchy di WebView Android.
  connectivity_plus: ^6.1.0
  # Cache manager — direct dep supaya bisa empty disk cache dari Settings
  # "Hapus cache". Sudah jadi transitive dep dari cached_network_image,
  # listing langsung supaya import-nya clean + version pinning.
  flutter_cache_manager: ^3.4.1
  # Android home screen widget — cart count + last order status di
  # launcher tanpa buka app. Pakai SharedPreferences (native) untuk
  # bridge data Flutter ↔ AppWidgetProvider. PWA Capacitor literally
  # cannot — WebView tidak punya akses ke widget host.
  home_widget: ^0.7.0
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.5
  tus_client_dart: ^2.5.0
  flutter_blurhash: ^0.9.1
  flutter_svg: ^2.0.17
  # GPS lokasi user — untuk auto-fill alamat dengan "Pakai Lokasi Saya"
  # button di address form. Native location services (Android FusedLocation
  # / iOS Core Location) — lebih akurat + hemat battery dari browser
  # geolocation API yang Capacitor PWA pakai.
  geolocator: ^13.0.4
  video_compress: ^3.1.4
  # Image compression sebelum upload — required karena Vercel serverless
  # limit body 4.5MB. Photo manager API kasih file original (4-6MB iPhone),
  # tanpa compress akan trigger 413 Request Entity Too Large. Pakai
  # FlutterImageCompress.compressAndGetFile dengan target 1920×1920 quality
  # 75 → ~500KB-1MB JPEG.
  flutter_image_compress: ^2.3.0
  # Image decode/crop/encode native Dart — dipakai untuk center-crop foto
  # ke aspect 4:5 sebelum upload (Instagram-style WYSIWYG). Source foto
  # dari galeri bisa 9:16, 4:3, 1:1, dsb — picker preview 4:5, jadi
  # file harus actual di-crop biar tidak kepotong di feed display.
  # flutter_image_compress hanya resize, tidak punya crop function — jadi
  # butuh image package.
  image: ^4.5.4
  # Android high refresh rate — opt-in ke 90/120Hz di Samsung Galaxy S /
  # Pixel Pro / OnePlus dll. Tanpa ini Android default locked 60fps walau
  # device support 120Hz. iOS sudah auto 120fps via Info.plist
  # CADisableMinimumFrameDurationOnPhone. Effect terasa di feed scroll +
  # carousel swipe + video transition (2x lebih smooth).
  flutter_displaymode: ^0.6.0
  # Emoji picker — keyboard kategori (Smileys, Animals, Food, dst) buat
  # composer caption & komentar. IG/TT-style: tap 😀 button di samping
  # input → bottom panel kategori. Tap emoji → inject ke TextField
  # controller di posisi cursor. Plain Unicode emoji (no image asset),
  # cross-platform rendering native via font.
  emoji_picker_flutter: ^4.0.0
  # Interactive crop widget — embeddable di picker preview area dengan
  # drag handles + pan/zoom. Plain Flutter (no native config), match
  # IG/TT crop UI: user drag/zoom image di dalam cropbox aspect tetap.
  # Saat tap Next, ambil bytes ter-crop sesuai posisi user via
  # CropController.croppedBitmap().
  crop_image: ^1.0.16
  # Video disk cache — wraps video_player API, simpan video file di disk
  # HP user setelah download pertama. Repeat-view feed → load dari disk
  # (instant, 0 data). Backed by flutter_cache_manager. Compatible drop-in
  # dengan video_player: CachedVideoPlayerPlus.networkUrl(uri) instead of
  # VideoPlayerController.networkUrl(uri). Akses underlying controller
  # via `.controller` property. TTL via invalidateCacheIfOlderThan.
  # Hanya dipakai di feed_screen (network video). File-based video di
  # composer/picker/my-posts tetap pakai VideoPlayerController.file().
  cached_video_player_plus: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  # End-to-end integration test driver — jalankan widget tree real di
  # device/emulator vs unit test yang isolated. Pakai `flutter test
  # integration_test/`.
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans[wght].ttf
  assets:
    - assets/brand/
    - assets/brands/
    - assets/banners/
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/products/
    - assets/native/
    - assets/lottie/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/native/icon-only.png
  adaptive_icon_background: "#1E5FBF"
  adaptive_icon_foreground: assets/native/icon-foreground.png
  min_sdk_android: 23
  remove_alpha_ios: true
flutter_native_splash:
  # Native splash: background full brand color + transparent logo.
  # iOS launch screen centers the image in points, so the image must not
  # include its own full-screen background or it becomes a visible square.
  color: "#1E5FBF"
  image: assets/native/splash-brand.png
  color_dark: "#0A0F1A"
  image_dark: assets/native/splash-brand-dark.png
  android: true
  ios: true
  web: false
  # Android 12+ uses the same transparent logo so it does not show a framed app icon.
  android_12:
    color: "#1E5FBF"
    image: assets/native/splash-logo.png
    color_dark: "#0A0F1A"
    image_dark: assets/native/splash-logo-dark.png
