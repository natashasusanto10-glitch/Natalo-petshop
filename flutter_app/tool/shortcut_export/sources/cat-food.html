<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natalo — animasi makanan kucing</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#18314c;font:15px/1.6 system-ui,sans-serif}main{max-width:820px;margin:32px auto;padding:24px}h1{font-size:27px;margin:6px 0}p{color:#637285}.tag{font-size:11px;letter-spacing:2px;color:#2186bd}.stage{background:white;border:1px solid #e1e7ee;border-radius:24px;padding:22px;margin:24px 0}.large{display:block;width:min(100%,500px);margin:auto}.small{display:block;width:88px;margin:auto}.compare{border-top:1px solid #edf0f3;padding:18px 0 0;text-align:center;font-size:12px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button{background:#176cad;color:white;border:0;border-radius:10px;padding:11px 18px;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #eca948;outline-offset:4px}label{display:flex;align-items:center;gap:8px}small{display:block;margin-top:18px;color:#637285}.pellet1{animation:drop1 3.2s both}.pellet2{animation:drop2 3.2s both}.loop .pellet1,.loop .pellet2{animation-iteration-count:infinite}.paused .pellet1,.paused .pellet2{animation-play-state:paused}@keyframes drop1{0%,12%{transform:translateY(0);opacity:1}29%{transform:translateY(225px);opacity:1}33%,100%{transform:translateY(247px);opacity:0}}@keyframes drop2{0%,25%{transform:translateY(0);opacity:1}40%{transform:translateY(172px);opacity:1}44%,100%{transform:translateY(190px);opacity:0}}@media(prefers-reduced-motion:reduce){.pellet1,.pellet2{animation:none}.manual .pellet1{animation:drop1 3.2s both}.manual .pellet2{animation:drop2 3.2s both}}@media(max-width:500px){main{padding:16px;margin:12px auto}.stage{padding:10px}}
</style><main><div class="tag">NATALO · PRATINJAU GERAK</div><h1>Makanan kucing</h1><p>Dua butir makanan jatuh bergantian, lalu berhenti.</p><section class="stage" id="stage"><svg class="large" viewBox="0 0 1469 1071" role="img" aria-label="Mangkuk makanan dengan lambang kucing, dua butir makanan jatuh bergantian"><defs><clipPath id="piece1"><path d="M635 155H776V281H635Z"/></clipPath><clipPath id="piece2"><path d="M783 267L823 266L886 326L887 378L770 376L751 329Z"/></clipPath><mask id="bowl"><rect width="1469" height="1071" fill="white"/><path d="M635 155H776V281H635Z M783 267L823 266L886 326L887 378L770 376L751 329Z" fill="black"/></mask><g id="art"><g class="pellet1"><image href="cat-food-coral.png" width="1469" height="1071" clip-path="url(#piece1)"/></g><g class="pellet2"><image href="cat-food-coral.png" width="1469" height="1071" clip-path="url(#piece2)"/></g><image href="cat-food-coral.png" width="1469" height="1071" mask="url(#bowl)"/></g></defs><use href="#art"/></svg><div class="compare"><svg class="small" viewBox="170 140 1130 770" role="img" aria-label="Pratinjau ukuran shortcut"><use href="#art"/></svg>Makanan Kucing</div></section><div class="controls"><button id="replay" type="button">Putar ulang</button><button id="pause" type="button" aria-pressed="false">Jeda</button><label><input type="checkbox" id="loop">Ulangi otomatis</label></div><small>Pratinjau animasi web memakai gambar pilihanmu. Belum berupa file Lottie.</small></main><script>
const stage=document.getElementById('stage'),pause=document.getElementById('pause');const initial=stage.innerHTML;function replay(){stage.classList.remove('paused');stage.classList.add('manual');stage.innerHTML=initial;pause.textContent='Jeda';pause.setAttribute('aria-pressed','false');}document.getElementById('replay').addEventListener('click',replay);pause.addEventListener('click',()=>{const paused=stage.classList.toggle('paused');pause.textContent=paused?'Lanjutkan':'Jeda';pause.setAttribute('aria-pressed',String(paused));});document.getElementById('loop').addEventListener('change',event=>{stage.classList.toggle('loop',event.target.checked);replay();});
</script></html>
