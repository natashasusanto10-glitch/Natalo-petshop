<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natalo — Voucher</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#18314c;font:15px/1.6 system-ui,sans-serif}main{max-width:780px;margin:28px auto;padding:24px}h1{font-size:28px;margin:4px 0}p,small{color:#637285}.eyebrow{font-size:11px;letter-spacing:2px;color:#b5296c}.stage{background:white;border:1px solid #e1e7ee;border-radius:24px;margin:24px 0;padding:24px}.icon{width:min(100%,410px);margin:auto}.icon svg{width:100%;display:block}.sample{text-align:center;border-top:1px solid #edf0f3;padding-top:16px;font-size:13px}.sample .icon{width:88px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{background:#B8266D;color:white;border:0;border-radius:10px;padding:11px 18px;font:inherit;cursor:pointer}label{display:flex;gap:8px;align-items:center}button:focus-visible,input:focus-visible{outline:3px solid #eca948;outline-offset:4px}small{display:block;margin-top:16px}@media(max-width:500px){main{padding:16px;margin:12px auto}}
</style></head><body><main><div class="eyebrow">NATALO · PREVIEW ANIMASI</div><h1>Voucher</h1><p>Satu voucher untuk diskon produk dan gratis ongkir.</p><section class="stage"><div class="icon" id="large"></div><div class="sample"><div class="icon" id="small"></div>Voucher</div></section><div class="controls"><button id="replay" type="button">Putar ulang</button><button id="pause" type="button" aria-pressed="false">Jeda</button><label><input id="loop" type="checkbox">Ulangi otomatis</label></div><small>Animasi 3,6 detik lalu diam. Preview web berbentuk vektor, belum file Lottie.</small></main><script>
const outline='M130 240H870Q900 240 900 270V383C834 383 834 477 900 477V590Q900 620 870 620H130Q100 620 100 590V477C166 477 166 383 100 383V270Q100 240 130 240Z';
function art(id){return `<svg viewBox="0 0 1000 860" role="img" aria-label="Voucher digital diskon produk dan gratis ongkir"><defs><clipPath id="ticket-${id}"><path d="${outline}"/></clipPath><clipPath id="truck-${id}"><rect x="540" y="287" width="306" height="237"/></clipPath></defs><g class="ticket"><g transform="rotate(-8 500 430)"><g clip-path="url(#ticket-${id})"><path d="${outline}" fill="#129B8C"/><rect x="90" y="235" width="410" height="395" fill="#7654C7"/><path d="M500 251V613" stroke="white" stroke-width="10" stroke-dasharray="15 18" stroke-linecap="round"/></g><g transform="translate(322 397) scale(.78) translate(-322 -430)"><g class="percent" fill="none" stroke="#FFF6E5" stroke-width="28"><circle cx="267" cy="359" r="34"/><circle cx="377" cy="497" r="34"/><path d="M254 517L390 337" stroke-linecap="round"/></g></g><g class="discount"><text x="322" y="574" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing=".4" fill="#FFF6E5">DISKON</text></g><g clip-path="url(#truck-${id})"><g class="truck"><g class="chassis" fill="#FFFFFF"><rect x="572" y="326" width="152" height="135" rx="13"/><path d="M735 365H782Q790 365 795 376L822 427V461H735Z"/><path d="M750 382H778L797 412H750Z" fill="#129B8C"/><rect x="574" y="448" width="249" height="14" rx="5"/></g><g fill="#FFFFFF" stroke="#129B8C" stroke-width="8"><circle cx="611" cy="466" r="27"/><circle cx="784" cy="466" r="27"/></g><g fill="#129B8C"><circle cx="611" cy="466" r="9"/><circle cx="784" cy="466" r="9"/></g></g><g class="speed" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"><path d="M545 377H563M538 398H559"/></g></g><g class="free"><text x="695" y="526" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="1" fill="#FFFFFF">GRATIS</text><text x="695" y="574" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing=".4" fill="#FFFFFF">ONGKIR</text></g></g></g></svg>`}
for(const id of ['large','small'])document.getElementById(id).innerHTML=art(id);
const icons=[...document.querySelectorAll('.icon svg')];const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>{x=clamp(x);return x*x*(3-2*x)};const pop=x=>{x=clamp(x);return 1+2.70158*(x-1)**3+1.70158*(x-1)**2};
function draw(t){const entry=pop(t/.72),fade=ease(t/.22);const pulse=Math.sin(Math.PI*clamp((t-.72)/.7));const drive=ease((t-1.45)/.85);const show=ease((t-2.1)/.45);const discountShow=ease((t-1.15)/.35);for(const svg of icons){const ticket=svg.querySelector('.ticket');ticket.setAttribute('transform',`translate(${(1-entry)*-48} ${(1-entry)*80}) translate(500 430) scale(${.86+.14*entry}) translate(-500 -430)`);ticket.setAttribute('opacity',fade);svg.querySelector('.percent').setAttribute('transform',`translate(322 430) rotate(${-3*pulse}) scale(${1+.1*pulse}) translate(-322 -430)`);svg.querySelector('.truck').setAttribute('transform',`translate(${-39+39*drive} ${-3*Math.sin(drive*Math.PI*4)})`);svg.querySelector('.truck').setAttribute('opacity',.5+.5*ease((t-1.35)/.25));svg.querySelector('.speed').setAttribute('opacity',Math.sin(Math.PI*drive)*.8);svg.querySelector('.discount').setAttribute('opacity',discountShow);svg.querySelector('.discount').setAttribute('transform','translate(0 '+((1-discountShow)*10)+')');svg.querySelector('.free').setAttribute('opacity',show);svg.querySelector('.free').setAttribute('transform',`translate(0 ${(1-show)*12})`)}}
const reduced=matchMedia('(prefers-reduced-motion: reduce)');let elapsed=0,last=null,playing=!reduced.matches,manual=false;const pause=document.getElementById('pause'),loop=document.getElementById('loop');function sync(){pause.textContent=playing?'Jeda':'Lanjutkan';pause.setAttribute('aria-pressed',String(!playing))}draw(reduced.matches?3.6:0);sync();function tick(now){if(last!==null&&playing){elapsed+=Math.min((now-last)/1000,.05);if(loop.checked&&elapsed>=5)elapsed=0;else if(!loop.checked&&elapsed>=3.6){elapsed=3.6;playing=false;sync()}draw(Math.min(elapsed,3.6))}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);function replay(){manual=true;elapsed=0;last=null;playing=true;draw(0);sync()}document.getElementById('replay').addEventListener('click',replay);pause.addEventListener('click',()=>{manual=true;if(!playing&&elapsed>=3.6)elapsed=0;playing=!playing;last=null;sync()});loop.addEventListener('change',()=>{if(loop.checked&&!playing)replay()});reduced.addEventListener('change',()=>{if(reduced.matches&&!manual){playing=false;draw(3.6);sync()}});document.addEventListener('visibilitychange',()=>{last=null});
</script></body></html>
