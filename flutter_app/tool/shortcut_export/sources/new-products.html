<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natalo — Produk Baru</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#18314c;font:15px/1.6 system-ui,sans-serif}main{max-width:780px;margin:28px auto;padding:24px}h1{font-size:28px;margin:4px 0}p,small{color:#637285}.eyebrow{font-size:11px;letter-spacing:2px;color:#2186bd}.stage{background:white;border:1px solid #e1e7ee;border-radius:24px;margin:24px 0;padding:20px}.icon{width:min(100%,390px);margin:auto}.icon svg{width:100%;display:block}.sample{text-align:center;border-top:1px solid #edf0f3;padding-top:16px;font-size:13px}.sample .icon{width:88px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{background:#176cad;color:white;border:0;border-radius:10px;padding:11px 18px;font:inherit;cursor:pointer}label{display:flex;gap:8px;align-items:center}button:focus-visible,input:focus-visible{outline:3px solid #eca948;outline-offset:4px}small{display:block;margin-top:16px}@media(max-width:500px){main{padding:16px;margin:12px auto}}
</style></head><body><main><div class="eyebrow">NATALO · PREVIEW ANIMASI</div><h1>Produk Baru</h1><p>Grid berputar, masuk ke tengah, lalu keluar bersama penanda NEW.</p><section class="stage"><div class="icon" id="large"></div><div class="sample"><div class="icon" id="small"></div>Produk Baru</div></section><div class="controls"><button type="button" id="replay">Putar ulang</button><button type="button" id="pause" aria-pressed="false">Jeda</button><label><input type="checkbox" id="loop">Ulangi otomatis</label></div><small>Gerakan 3 detik lalu diam. Preview web, belum file Lottie.</small></main><script>
function art(id){const cells=[[210,210],[634,210],[210,634],[634,634]];return `<svg viewBox="0 0 1280 1280" role="img" aria-label="Empat kartu produk petshop berputar, masuk ke tengah, lalu keluar dengan label NEW"><defs>${cells.map(([x,y],i)=>`<clipPath id="${id}-cell-${i}"><rect x="${x}" y="${y}" width="412" height="412" rx="65"/></clipPath>`).join('')}</defs>${cells.map(([x,y],i)=>`<g class="tile" data-index="${i}"><g transform="translate(${-x-206} ${-y-206})"><rect x="${x}" y="${y}" width="412" height="412" rx="65" fill="${['#DCC6FA','#FFDCAD','#C9F5E1','#FAD0D6'][i]}"/><image href="products-color.png" width="1280" height="1280" clip-path="url(#${id}-cell-${i})"/></g></g>`).join('')}<g class="badge"><rect x="-166" y="-62" width="332" height="124" rx="40" fill="#FFD45A" stroke="white" stroke-width="10"/><text x="-5" y="33" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Black, sans-serif" font-size="98" font-weight="400" letter-spacing="3" transform="skewX(-9)" fill="#063B75">NEW</text></g></svg>`}
for(const id of ['large','small'])document.getElementById(id).innerHTML=art(id);
const tiles=[...document.querySelectorAll('.tile')],badges=[...document.querySelectorAll('.badge')];const start=[[-212,-212],[212,-212],[-212,212],[212,212]];const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>{x=clamp(x);return x*x*(3-2*x)};const out=x=>{x=clamp(x);return 1+2.70158*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};
function draw(t){let angle=0,radius=1,scale=1,opacity=1;if(t<1.05){angle=Math.PI/2*ease((t-.15)/.9)}else if(t<1.65){const p=ease((t-1.05)/.6);angle=Math.PI/2;radius=1-p;scale=1-.88*p;opacity=1-p}else{const p=out((t-1.7)/.8);angle=Math.PI/2;radius=p;scale=.12+.88*p;opacity=clamp((t-1.7)/.18)}tiles.forEach(el=>{const [x,y]=start[Number(el.dataset.index)];const dx=(x*Math.cos(angle)-y*Math.sin(angle))*radius,dy=(x*Math.sin(angle)+y*Math.cos(angle))*radius;el.setAttribute('transform',`translate(${628+dx} ${628+dy}) scale(${scale})`);el.setAttribute('opacity',String(opacity))});const p=out((t-2.3)/.5);badges.forEach(el=>{el.setAttribute('transform',`translate(628 ${658-30*p}) scale(${Math.max(.01,p)})`);el.setAttribute('opacity',String(clamp((t-2.3)/.14)))})}
const reduced=matchMedia('(prefers-reduced-motion: reduce)');let elapsed=0,last=null,playing=!reduced.matches,manual=false;const pause=document.getElementById('pause'),loop=document.getElementById('loop');function sync(){pause.textContent=playing?'Jeda':'Lanjutkan';pause.setAttribute('aria-pressed',String(!playing))}draw(reduced.matches?3:0);sync();function tick(now){if(last!==null&&playing){elapsed+=Math.min((now-last)/1000,.05);if(elapsed>=4.1&&loop.checked)elapsed=0;else if(elapsed>=3&&!loop.checked){elapsed=3;playing=false;sync()}draw(Math.min(elapsed,3))}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);document.getElementById('replay').addEventListener('click',()=>{manual=true;elapsed=0;last=null;playing=true;draw(0);sync()});pause.addEventListener('click',()=>{manual=true;if(!playing&&elapsed>=3)elapsed=0;playing=!playing;last=null;sync()});loop.addEventListener('change',()=>{if(loop.checked&&!playing){manual=true;elapsed=0;last=null;playing=true;sync()}});reduced.addEventListener('change',()=>{if(reduced.matches&&!manual){playing=false;draw(3);sync()}});document.addEventListener('visibilitychange',()=>{last=null});
</script></body></html>
