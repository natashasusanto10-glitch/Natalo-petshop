<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natalo — Kobaran Promo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#18314c;font:15px/1.6 system-ui,sans-serif}main{max-width:780px;margin:28px auto;padding:24px}h1{font-size:28px;margin:4px 0}p,small{color:#637285}.eyebrow{font-size:11px;letter-spacing:2px;color:#2186bd}.stage{background:white;border:1px solid #e1e7ee;border-radius:24px;margin:24px 0;padding:24px}.icon{width:min(100%,360px);margin:auto}.icon svg{display:block;width:100%;height:auto}.sample{text-align:center;border-top:1px solid #edf0f3;padding-top:16px;font-size:13px}.sample .icon{width:88px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{background:#176cad;color:white;border:0;border-radius:10px;padding:11px 18px;font:inherit;cursor:pointer}label{display:flex;align-items:center;gap:8px}button:focus-visible,input:focus-visible{outline:3px solid #eca948;outline-offset:4px}small{display:block;margin-top:16px}@media(max-width:500px){main{padding:16px;margin:12px auto}}
</style></head><body><main><div class="eyebrow">NATALO · PREVIEW ANIMASI</div><h1>Promo</h1><p>Api berkobar, simbol % miring dan memantul halus mengikuti iramanya.</p><section class="stage"><div class="icon" id="large"></div><div class="sample"><div class="icon" id="small"></div>Promo</div></section><div class="controls"><button id="replay" type="button">Putar ulang</button><button id="pause" type="button" aria-pressed="false">Jeda</button><label><input id="loop" type="checkbox">Ulangi otomatis</label></div><small>Preview gerakan kobaran dengan bentuk vektor mengikuti desain pilihan Anda; belum file Lottie.</small></main><script>
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function artwork(id){return `<svg viewBox="0 0 1280 1280" role="img" aria-label="Api promo merah berkobar dengan simbol persen emas"><defs><clipPath id="clip-${id}"><path class="contour"/></clipPath></defs><g clip-path="url(#clip-${id})"><rect width="1280" height="1280" fill="#F34343"/><path d="M228 674C247 883 414 1010 643 990C850 978 1001 875 1023 603L1170 1030L859 1180H365L164 938Z" fill="#DC2639"/><path d="M389 1080Q638 938 879 1080Q647 1210 389 1080Z" fill="#169EEE" stroke="#063B75" stroke-width="30"/></g><path class="contour" fill="none" stroke="#063B75" stroke-width="36" stroke-linejoin="round" stroke-linecap="round"/><g class="percent" fill="none" stroke="#FFD45A" stroke-width="62"><circle cx="510" cy="680" r="64"/><circle cx="751" cy="863" r="64"/><path d="M505 918L759 619" stroke-linecap="round"/></g><g fill="#F34343"><path class="ember" d="M0 -27Q27 -1 14 17Q-5 32 -16 12Q-22 -3 0 -27Z" opacity="0"/><path class="ember" d="M0 -27Q27 -1 14 17Q-5 32 -16 12Q-22 -3 0 -27Z" opacity="0"/><path class="ember" d="M0 -27Q27 -1 14 17Q-5 32 -16 12Q-22 -3 0 -27Z" opacity="0"/></g></svg>`}
for(const id of ['large','small'])document.getElementById(id).innerHTML=artwork(id);
const contours=[...document.querySelectorAll('.contour')],icons=[...document.querySelectorAll('.icon svg')];
function render(seconds){const w=2*Math.PI*seconds/1.45;const a=Math.sin(w),b=Math.sin(2*w+.6)-Math.sin(.6),c=Math.sin(3*w-.4)+Math.sin(.4);const d=`M ${553+94*a} ${125-46*b} C ${590+110*a} ${220-58*b} ${588+55*b} 317 ${477+39*c} ${450-31*b} Q ${444+41*c} ${380-42*a} ${385+57*c} ${347-57*a} C ${390+61*c} ${492-34*a} 288 546 239 684 C 151 908 288 1129 626 1138 C 890 1147 1120 962 1047 701 C 1012 566 ${958+36*b} ${450-24*c} ${900+47*b} ${380-51*c} Q ${899+48*b} ${515-37*c} ${816+33*a} 541 C ${845+43*a} ${345-40*b} ${795+74*a} ${174-37*b} ${553+94*a} ${125-46*b} Z`;contours.forEach(p=>p.setAttribute('d',d));for(const svg of icons){const p=2*Math.PI*seconds/2.9;const pop=Math.pow(Math.max(0,Math.sin(p)),3);const settle=Math.pow(Math.max(0,-Math.sin(p)),5);const size=1+.075*pop-.022*settle;const tilt=4.5*Math.sin(p);const lift=-13*pop+4*settle;svg.querySelector('.percent').setAttribute('transform',`translate(630 ${770+lift}) rotate(${tilt}) scale(${size}) translate(-630 -770)`);svg.querySelectorAll('.ember').forEach((p,i)=>{const phase=((seconds/.95+i/3)%1+1)%1;const startX=[370,925,655][i],startY=[345,396,156][i];const x=startX+Math.sin(phase*5+i)*44,y=startY-phase*230;const scale=(1-phase)*(.82+i*.11);const opacity=Math.sin(phase*Math.PI)*.95;p.setAttribute('transform',`translate(${x} ${y}) rotate(${Math.sin(phase*5)*22}) scale(${scale})`);p.setAttribute('opacity',seconds===0?'0':String(opacity))})}}
let elapsed=0,last=null,playing=!reduced.matches,manual=false;const pause=document.getElementById('pause'),loop=document.getElementById('loop');function sync(){pause.textContent=playing?'Jeda':'Lanjutkan';pause.setAttribute('aria-pressed',String(!playing))}function tick(now){if(last!==null&&playing){elapsed+=Math.min((now-last)/1000,.05);if(!loop.checked&&elapsed>=4.8){elapsed=0;playing=false;sync()}render(elapsed)}last=now;requestAnimationFrame(tick)}render(0);sync();requestAnimationFrame(tick);document.getElementById('replay').addEventListener('click',()=>{manual=true;elapsed=0;last=null;playing=true;render(0);sync()});pause.addEventListener('click',()=>{manual=true;playing=!playing;last=null;sync()});reduced.addEventListener('change',()=>{if(reduced.matches&&!manual){playing=false;elapsed=0;render(0);sync()}});document.addEventListener('visibilitychange',()=>{last=null});
</script></body></html>
