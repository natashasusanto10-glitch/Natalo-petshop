<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natalo — animasi makanan ikan</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#18314c;font:15px/1.6 system-ui,sans-serif}main{max-width:860px;margin:24px auto;padding:24px}h1{font-size:28px;margin:8px 0}p{color:#637285}.tag{font-size:11px;letter-spacing:2px;color:#2186bd}.stage{background:white;border:1px solid #e1e7ee;border-radius:24px;padding:12px;margin:24px 0}.large{display:block;width:min(100%,540px);margin:auto}.small{display:block;width:100px;margin:auto}.compare{border-top:1px solid #edf0f3;padding:12px 0;text-align:center;font-size:12px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{background:#176cad;color:white;border:0;border-radius:10px;padding:11px 18px;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #eca948;outline-offset:4px}label{display:flex;gap:8px;align-items:center}small{display:block;margin-top:18px;color:#637285}.jar{transform-origin:735px 800px;animation:pour 4s both}.lid{animation:lid 4s both}.lid-turn{transform-origin:735px 335px;animation:unscrew 4s both}.cap-grooves{animation:grooves 4s both}.thread{opacity:0;animation:thread 4s both}.grain{opacity:0;animation:grain 4s both;transform-origin:0 0}.g2{animation-name:grain2}.g3{animation-name:grain3}.loop .moving{animation-iteration-count:infinite}.paused .moving{animation-play-state:paused}@keyframes pour{0%,22%{transform:rotate(0)}40%,59%{transform:rotate(42deg)}78%,100%{transform:rotate(0)}}@keyframes lid{0%,5%{transform:translate(0,0)}10%{transform:translate(0,-12px)}15%{transform:translate(0,-26px)}20%{transform:translate(0,-42px)}26%,72%{transform:translate(-110px,-165px)}79%{transform:translate(0,-42px)}84%{transform:translate(0,-26px)}89%{transform:translate(0,-12px)}95%,100%{transform:translate(0,0)}}@keyframes unscrew{0%,5%{transform:skewY(0deg) scaleX(1)}8%{transform:skewY(-2deg) scaleX(.98)}11%{transform:skewY(0deg) scaleX(1)}14%{transform:skewY(-2deg) scaleX(.98)}17%{transform:skewY(0deg) scaleX(1)}20%{transform:skewY(-2deg) scaleX(.98)}23%,79%{transform:skewY(0deg) scaleX(1)}82%{transform:skewY(-2deg) scaleX(.98)}85%{transform:skewY(0deg) scaleX(1)}88%{transform:skewY(-2deg) scaleX(.98)}91%{transform:skewY(0deg) scaleX(1)}94%{transform:skewY(-2deg) scaleX(.98)}97%,100%{transform:skewY(0deg) scaleX(1)}}@keyframes grooves{0%,5%{transform:translateX(0)}20%,79%{transform:translateX(-330px)}96%,100%{transform:translateX(0)}}@keyframes thread{0%,8%{opacity:0}16%,85%{opacity:1}96%,100%{opacity:0}}@keyframes grain{0%,39%{opacity:0;transform:translate(995px,490px) rotate(0)}41%{opacity:1;transform:translate(995px,490px)}54%{opacity:1;transform:translate(1155px,840px) rotate(140deg)}58%,100%{opacity:0;transform:translate(1165px,890px) rotate(155deg)}}@keyframes grain2{0%,44%{opacity:0;transform:translate(995px,490px)}46%{opacity:1;transform:translate(995px,490px)}59%{opacity:1;transform:translate(1200px,825px) rotate(100deg)}63%,100%{opacity:0;transform:translate(1210px,890px) rotate(120deg)}}@keyframes grain3{0%,49%{opacity:0;transform:translate(995px,490px)}51%{opacity:1;transform:translate(995px,490px)}64%{opacity:1;transform:translate(1105px,840px) rotate(-110deg)}68%,100%{opacity:0;transform:translate(1115px,890px) rotate(-125deg)}}@media(prefers-reduced-motion:reduce){.stage:not(.manual) .moving{animation:none}}@media(max-width:500px){main{padding:14px;margin:8px auto}}
</style><main><div class="tag">NATALO · PRATINJAU GERAK</div><h1>Makanan ikan</h1><p>Tutup diputar lepas dari ulir → tiga pelet dituang → tutup diputar rapat kembali.</p><section class="stage" id="stage"><svg class="large" viewBox="180 30 1200 1000" role="img" aria-label="Animasi tabung pakan ikan memutar tutup berulir, menuang tiga pelet, lalu memutar tutup kembali"><defs><clipPath id="grooveClip"><rect x="620" y="344" width="224" height="88" rx="15"/></clipPath><clipPath id="lidClip"><path d="M370 190H1090V397Q1060 453 735 453Q412 453 370 397Z"/></clipPath><clipPath id="bodyClip"><path d="M389 398Q425 452 735 452Q1050 452 1080 397V690L1045 698L1010 738L975 733L944 781L923 837H380Z"/></clipPath><clipPath id="pileClip"><path d="M1080 680L1133 717L1152 754L1209 782V867H924V797L958 752L987 724L1010 738L1045 698Z"/></clipPath><g id="grainShape"><path d="M-14 8Q-20 2 -8 -15Q0 -23 10 -12L19 8Q19 19 3 17Z" fill="#D99567" stroke="#26343B" stroke-width="5" stroke-linejoin="round"/></g><g id="fishArt"><g class="jar moving"><g class="thread moving" fill="#ADE4D8" stroke="#26343B" stroke-width="8"><path d="M430 421V379Q735 335 1040 379V421Z"/><path d="M438 383Q735 431 1032 383M438 399Q735 447 1032 399" fill="none"/></g><ellipse cx="735" cy="433" rx="325" ry="48" fill="#285F57" stroke="#26343B" stroke-width="12"/><image href="fish-food-teal.png" width="1470" height="1070" clip-path="url(#bodyClip)"/></g><g class="lid moving"><g class="lid-turn moving"><image href="fish-food-teal.png" width="1470" height="1070" clip-path="url(#lidClip)"/><g clip-path="url(#grooveClip)"><rect x="620" y="344" width="224" height="88" fill="#159E91"/><g class="cap-grooves moving" stroke="#11675F" stroke-width="16" stroke-linecap="round"><path d="M625 360V417M708 360V417M791 360V417M874 360V417M957 360V417M1040 360V417M1123 360V417"/></g></g></g></g><g class="grain moving"><use href="#grainShape"/></g><g class="grain g2 moving"><use href="#grainShape"/></g><g class="grain g3 moving"><use href="#grainShape"/></g><image href="fish-food-teal.png" width="1470" height="1070" clip-path="url(#pileClip)"/></g></defs><use href="#fishArt"/></svg><div class="compare"><svg class="small" viewBox="180 30 1200 1000" role="img" aria-label="Animasi dalam ukuran shortcut"><use href="#fishArt"/></svg>Makanan Ikan</div></section><div class="controls"><button id="replay" type="button">Putar ulang</button><button id="pause" type="button" aria-pressed="false">Jeda</button><label><input id="loop" type="checkbox">Ulangi otomatis</label></div><small>Pratinjau animasi web memakai gambar revisi. Belum berupa file Lottie.</small></main><script>
const stage=document.getElementById('stage'),pause=document.getElementById('pause');const initial=stage.innerHTML;function replay(){stage.classList.remove('paused');stage.classList.add('manual');stage.innerHTML=initial;pause.textContent='Jeda';pause.setAttribute('aria-pressed','false');}document.getElementById('replay').addEventListener('click',replay);pause.addEventListener('click',()=>{const paused=stage.classList.toggle('paused');pause.textContent=paused?'Lanjutkan':'Jeda';pause.setAttribute('aria-pressed',String(paused));});document.getElementById('loop').addEventListener('change',event=>{stage.classList.toggle('loop',event.target.checked);replay();});
</script></html>
