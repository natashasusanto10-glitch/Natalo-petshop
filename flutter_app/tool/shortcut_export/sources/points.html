<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natalo — Tukar Poin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#51351f;font:15px/1.6 system-ui,sans-serif}main{max-width:780px;margin:28px auto;padding:24px}h1{font-size:28px;margin:4px 0}p,small{color:#756b60}.eyebrow{font-size:11px;letter-spacing:2px;color:#B45C19}.stage{background:white;border:1px solid #e8e3dc;border-radius:24px;margin:24px 0;padding:24px}.icon{width:min(100%,360px);margin:auto}.icon svg{display:block;width:100%}.sample{text-align:center;border-top:1px solid #edf0f3;padding-top:16px;font-size:13px}.sample .icon{width:88px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{background:#A95116;color:white;border:0;border-radius:10px;padding:11px 18px;font:inherit;cursor:pointer}label{display:flex;gap:8px;align-items:center}button:focus-visible,input:focus-visible{outline:3px solid #E9AA36;outline-offset:4px}small{display:block;margin-top:16px}@media(max-width:500px){main{padding:16px;margin:12px auto}}
</style></head><body><main><div class="eyebrow">NATALO · PREVIEW ANIMASI</div><h1>Tukar Poin</h1><p>Koin NL Point berubah menjadi kado, lalu kartu REWARD muncul dari dalam saat tutup terbuka.</p><section class="stage"><div class="icon" id="large"></div><div class="sample"><div class="icon" id="small"></div>Tukar Poin</div></section><div class="controls"><button id="replay" type="button">Putar ulang</button><button id="pause" type="button" aria-pressed="false">Jeda</button><label><input id="loop" type="checkbox">Ulangi otomatis</label></div><small>Animasi 3,8 detik lalu diam. Preview web dengan koin NL Point baru, belum file Lottie.</small></main><script>
function art(id){return `<svg viewBox="0 0 640 640" role="img" aria-label="Koin NL Point berubah menjadi kado merah dengan pita emas"><defs><clipPath id="lid-${id}"><rect x="0" y="0" width="1280" height="560"/></clipPath><clipPath id="body-${id}"><rect x="0" y="560" width="1280" height="720"/></clipPath><clipPath id="reward-exit-${id}"><path d="M0 0H1280V630L1048 666L650 785L194 675L0 620Z"/></clipPath></defs><g class="coin"><image href="nl-point-coin.png" x="149" y="149" width="342" height="342"/></g><g class="gift"><g transform="translate(115.2 100) scale(.32)"><image href="gift-red-gold.png" width="1280" height="1280" clip-path="url(#body-${id})"/><g clip-path="url(#reward-exit-${id})"><g class="reward"><rect x="-192" y="-115" width="384" height="230" rx="30" fill="#FFF3CF" stroke="#DBA02B" stroke-width="14"/><path d="M-155 -76H155" stroke="#FFE19B" stroke-width="9" stroke-linecap="round"/><path d="M0 -66L17 -30L56 -25L28 2L35 41L0 23L-35 41L-28 2L-56 -25L-17 -30Z" fill="#E8A71F"/><text x="0" y="84" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="47" font-weight="800" letter-spacing="2" fill="#855113">REWARD</text></g></g><g class="sparkles" fill="#FFD45A"><path d="M344 430L356 463L389 475L356 487L344 520L332 487L299 475L332 463Z"/><path d="M957 495L967 520L992 530L967 540L957 565L947 540L922 530L947 520Z"/></g><g class="lid"><image href="gift-red-gold.png" width="1280" height="1280" clip-path="url(#lid-${id})"/></g></g></g></svg>`}
for(const id of ['large','small'])document.getElementById(id).innerHTML=art(id);
const icons=[...document.querySelectorAll('.icon svg')];const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>{x=clamp(x);return x*x*(3-2*x)};const pop=x=>{x=clamp(x);return 1+2.70158*(x-1)**3+1.70158*(x-1)**2};
function draw(t){const spin=ease((t-.18)/.85);const shrink=ease((t-1.05)/.43);const coinSize=1-.9*shrink;const flip=.13+.87*Math.abs(Math.cos(spin*Math.PI));const reveal=clamp((t-1.32)/.57),giftSize=.14+.86*pop(reveal);const open=pop((t-2.32)/.58);const rise=pop((t-2.7)/.65);const rewardAlpha=ease((t-2.7)/.2);for(const svg of icons){const coin=svg.querySelector('.coin');coin.setAttribute('transform',`translate(320 320) scale(${coinSize*flip} ${coinSize}) rotate(${-8*Math.sin(spin*Math.PI)}) translate(-320 -320)`);coin.setAttribute('opacity',1-ease((t-1.28)/.2));const gift=svg.querySelector('.gift');gift.setAttribute('opacity',ease((t-1.32)/.18));gift.setAttribute('transform',`translate(320 356) scale(${giftSize}) translate(-320 -356)`);svg.querySelector('.lid').setAttribute('transform',`translate(${-65*open} ${236*(1-open)-125*open}) rotate(${-7*open} 640 400)`);svg.querySelector('.reward').setAttribute('transform',`translate(650 ${920-335*rise}) rotate(${-6*rise}) scale(${.8+.2*rise})`);svg.querySelector('.reward').setAttribute('opacity',rewardAlpha);svg.querySelector('.sparkles').setAttribute('opacity',Math.sin(Math.PI*clamp((t-2.9)/.8))*.9)}}
const reduced=matchMedia('(prefers-reduced-motion: reduce)');let elapsed=0,last=null,playing=!reduced.matches,manual=false;const pause=document.getElementById('pause'),loop=document.getElementById('loop');function sync(){pause.textContent=playing?'Jeda':'Lanjutkan';pause.setAttribute('aria-pressed',String(!playing))}draw(reduced.matches?3.8:0);sync();function tick(now){if(last!==null&&playing){elapsed+=Math.min((now-last)/1000,.05);if(loop.checked&&elapsed>=5)elapsed=0;else if(!loop.checked&&elapsed>=3.8){elapsed=3.8;playing=false;sync()}draw(Math.min(elapsed,3.8))}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);function replay(){manual=true;elapsed=0;last=null;playing=true;draw(0);sync()}document.getElementById('replay').addEventListener('click',replay);pause.addEventListener('click',()=>{manual=true;if(!playing&&elapsed>=3.8)elapsed=0;playing=!playing;last=null;sync()});loop.addEventListener('change',()=>{if(loop.checked&&!playing)replay()});reduced.addEventListener('change',()=>{if(reduced.matches&&!manual){playing=false;draw(3.8);sync()}});document.addEventListener('visibilitychange',()=>{last=null});
</script></body></html>
