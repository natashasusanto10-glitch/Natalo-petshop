name: natalo_feed
description: Natalo Petshop feed module — Flutter port of Wave 1-4 features
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management — Riverpod (Wave 1-4 mirror)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP client
  dio: ^5.4.3+1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Video — Wave 1 network-aware + Wave 2 HLS + Wave 4 cinema
  # better_player_plus is the maintained fork (supports Flutter 3.22+, HLS, fullscreen)
  better_player_plus: ^1.0.8

  # Blurhash LQIP — Wave 2
  flutter_blurhash: ^0.8.2

  # TUS resumable upload — Wave 3
  # No mature pub.dev TUS client — we hand-roll a minimal client over dio
  # See lib/api/bunny_upload.dart
  crypto: ^3.0.3

  # Connectivity + device info — for network tier + memory tier
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0
  network_info_plus: ^5.0.3

  # App lifecycle (Wave 3) — built-in via WidgetsBindingObserver, no pkg needed

  # Local storage — pending upload state TTL 24h (Wave 3)
  shared_preferences: ^2.2.3

  # Push notifications — Wave 4
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.1.2

  # Haptics, share, image picker — replace Capacitor plugins
  haptic_feedback: ^0.5.1
  share_plus: ^9.0.0
  image_picker: ^1.1.2
  video_player: ^2.9.0   # used internally by better_player + for thumbnail extract
  video_thumbnail: ^0.5.3

  # Lottie success animation
  lottie: ^3.1.2

  # Routing
  go_router: ^14.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
