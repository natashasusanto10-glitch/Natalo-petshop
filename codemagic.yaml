workflows:
  ios-testflight:
    name: iOS TestFlight Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.natalo.petshop
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "REPLACE_WITH_NUMERIC_APPLE_ID"
      node: 20
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: natalo-asc
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-v*'
          include: true
    scripts:
      - name: Install npm deps
        script: npm ci
      - name: Build Next.js fallback webDir (out/)
        script: |
          if ! npm run build; then
            echo "next build failed, falling back to placeholder out/"
            mkdir -p out
            echo '<!doctype html><meta charset="utf-8"><title>Natalo Petshop</title>' > out/index.html
          fi
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Bump build number from Codemagic BUILD_NUMBER
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 100))
      - name: Fetch signing files (App + NotificationServiceExtension)
        script: |
          app-store-connect fetch-signing-files com.natalo.petshop \
            --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files com.natalo.petshop.NotificationServiceExtension \
            --type IOS_APP_STORE --create
      - name: Add certs to keychain
        script: keychain add-certificates
      - name: Apply provisioning profiles to Xcode project
        script: xcode-project use-profiles
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
      email:
        recipients:
          - natasha.susanto10@gmail.com
        notify:
          success: true
          failure: true
