workflows:
  # ============================================================
  # Flutter iOS — build .ipa dari folder flutter_app/ → TestFlight
  # ============================================================
  # Bundle: com.natalo.petshop (replace Capacitor existing di App Store
  # record yang sama). Sign via App Store Connect API key integration
  # `natalo-asc`. Pakai untuk validate Flutter pipeline + TestFlight
  # preview. JANGAN promote ke production sampai feature-parity tercapai
  # (banyak stub screen di flutter_app/lib/screens/ belum diport real).
  flutter-ios-testflight:
    name: Flutter iOS — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # DIPATOK, jangan kembalikan ke `stable`.
      #
      # `flutter: stable` membuat CI mengunduh Flutter stable TERBARU tiap
      # build, bukan versi yang dipakai tim. Pada 19 Agustus 2026 Flutter
      # 3.47.1 rilis dan menaikkan minimum iOS pod Flutter dari 13.0 ke
      # 15.0 — build berikutnya langsung gagal di `pod install` dengan
      # "could not find compatible versions for pod Flutter ... required a
      # higher minimum deployment target", padahal TIDAK ADA perubahan di
      # repo ini. Aplikasi menargetkan iOS 13.0.
      #
      # 3.44.7 = versi yang dipakai pengembangan lokal (flutter/version).
      # Menaikkan versi Flutter harus jadi keputusan sadar (dan butuh
      # menaikkan IPHONEOS_DEPLOYMENT_TARGET + platform :ios di Podfile,
      # yang berarti membuang pengguna iOS 13/14) — bukan sesuatu yang
      # terjadi diam-diam karena CI mengunduh rilis baru.
      flutter: 3.44.7
      # CATATAN: `xcode: latest` punya penyakit yang SAMA — Xcode baru bisa
      # mengubah perilaku build tanpa perubahan kode. Sengaja BELUM dipatok
      # di sini supaya perbaikan ini hanya mengubah satu variabel; kalau
      # dipatok bersamaan dan build tetap gagal, tak ketahuan mana
      # penyebabnya. Patok setelah build ini terbukti hijau, dengan versi
      # Xcode yang benar-benar tersedia di Codemagic.
      xcode: latest
      cocoapods: default
      # Code signing handled explicitly via script step di bawah —
      # `app-store-connect fetch-signing-files --create`. Pre-build
      # `ios_signing` block dinonaktifkan supaya error spesifik dari
      # Apple API muncul di log script step (bukan di-summarize jadi
      # "No matching profiles found" yang generic).
      groups:
        # Import variable group `ios_signing` dari Codemagic dashboard.
        # Group ini harus berisi CERTIFICATE_PRIVATE_KEY (RSA PEM, Secure)
        # yang di-reference via @env:CERTIFICATE_PRIVATE_KEY di
        # fetch-signing-files script step.
        - ios_signing
      vars:
        # Working dir untuk semua step Flutter. Repo root berisi Next.js +
        # Capacitor + folder flutter_app/, jadi semua command flutter harus
        # di-jalankan dari sini.
        FLUTTER_PROJECT_DIR: "flutter_app"
        # Apple ID numeric dari URL App Store Connect setelah app di-create:
        # https://appstoreconnect.apple.com/apps/<APP_ID_NUMERIC>/...
        # Set di Codemagic UI: App settings → Environment variables.
        # APP_STORE_APPLE_ID: <set di dashboard>

    # Integration name "natalo-asc" harus persis match dengan App Store
    # Connect API key yang Anda upload di Codemagic → Settings → Integrations.
    integrations:
      app_store_connect: natalo-asc

    # Trigger build hanya saat push tag yang match pola "flutter-ios-v*"
    # (mis. flutter-ios-v1.0.1). Lebih aman daripada trigger setiap push
    # ke main, supaya tidak waste build credit per kecil-kecil commit.
    # Build pertama tetap bisa dijalankan manual via Codemagic UI ("Start
    # new build" button) sebelum pakai tag trigger.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'flutter-ios-v*'
          include: true

    scripts:
      - name: Flutter pub get
        script: |
          cd $FLUTTER_PROJECT_DIR
          flutter pub get

      - name: Pod install
        script: |
          cd $FLUTTER_PROJECT_DIR/ios
          # Repo-update tarik index pod terbaru. Tanpa ini, kadang
          # Firebase pods versi baru tidak ke-resolve.
          pod install --repo-update

      - name: Set build number from BUILD_NUMBER
        script: |
          cd $FLUTTER_PROJECT_DIR/ios
          # Offset +1 supaya tidak conflict dengan build sebelumnya yang
          # mungkin pernah di-upload manual via Xcode.
          agvtool new-version -all $(($BUILD_NUMBER + 1))

      - name: Initialize keychain for signing
        script: |
          # Create fresh keychain + unlock + set partition list permissions
          # supaya codesign tool boleh akses private key tanpa prompt
          # interactive (errSecInternalComponent kalau gagal). Wajib
          # sebelum add-certificates + sebelum xcodebuild archive.
          keychain initialize

      - name: Diagnostic — list certs + profiles at start
        script: |
          # Cetak state Apple Developer Portal sebelum signing.
          # Pakai untuk debug "No matching profiles" — kita tahu pasti
          # cert + profile apa yang ada (atau tidak) di Apple side.
          echo "=== Existing certificates ==="
          app-store-connect certificates list || true
          echo ""
          echo "=== Existing profiles for com.natalo.petshop ==="
          app-store-connect profiles list --bundle-id-identifier com.natalo.petshop || true
          echo ""
          echo "=== App IDs (Bundle IDs) at Apple Developer ==="
          app-store-connect bundle-ids list | grep -A2 "com.natalo.petshop" || true

      - name: Fetch signing files (verbose)
        script: |
          # --verbose supaya Apple API error response muncul lengkap di log
          # --certificate-key=@env:CERTIFICATE_PRIVATE_KEY pakai syntax
          # khusus Codemagic CLI: prefix `@env:` artinya value dari env
          # variable di Codemagic dashboard. Tanpa flag ini error:
          # "Cannot save Signing Certificates without certificate private key".
          # Setup env var: ssh-keygen -t rsa -b 2048 -m PEM -f key -N ""
          # → paste full PEM content sebagai CERTIFICATE_PRIVATE_KEY (Secure).
          app-store-connect fetch-signing-files com.natalo.petshop \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --verbose

      - name: Fetch signing files — NotificationService extension (verbose)
        script: |
          # Profile terpisah untuk target NotificationService (Notification
          # Service Extension, lihat flutter_app/ios/NotificationService/) —
          # tiap App Extension dianggap Apple sebagai bundle ID sendiri.
          #
          # PRASYARAT MANUAL (belum bisa di-skip lewat script ini): Bundle ID
          # com.natalo.petshop.NotificationService HARUS sudah terdaftar
          # sebagai App ID di Apple Developer Portal (App Extension type)
          # SEBELUM step ini bisa fetch/create profile-nya. --create di sini
          # cuma bikin PROFILE baru, bukan App ID-nya. Kalau App ID belum
          # terdaftar, step ini akan gagal dengan error jelas dari Apple API
          # (bukan silent) — daftarkan dulu via developer.apple.com →
          # Certificates, Identifiers & Profiles → Identifiers → (+).
          app-store-connect fetch-signing-files com.natalo.petshop.NotificationService \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --verbose

      - name: Add certs to keychain
        script: keychain add-certificates

      - name: Apply provisioning profiles to Xcode project
        script: xcode-project use-profiles

      - name: Flutter build ipa
        script: |
          cd $FLUTTER_PROJECT_DIR
          # --export-options-plist generated otomatis oleh xcode-project
          # use-profiles step di atas — pakai signing yang sudah di-fetch.
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - flutter_app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        # Auth pakai integration yang sama dengan fetch signing files —
        # token API key, bukan password Apple ID.
        auth: integration
        # Auto-submit ke TestFlight processing (tidak langsung public).
        # Builds yang sudah "Ready to Submit" baru bisa dipromote ke
        # External Tester / App Store Review secara manual via App Store
        # Connect UI.
        submit_to_testflight: true
        # Optional: kirim ke beta group setelah TestFlight ready.
        # Hapus kalau belum bikin internal testing group.
        beta_groups:
          - Internal Testers
      email:
        recipients:
          - natasha.susanto10@gmail.com
        notify:
          success: true
          failure: true
